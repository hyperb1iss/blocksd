name: Set up JavaScript project
description: Install the declared pnpm version and frozen dependencies on Node 24
inputs:
  directory:
    description: Project directory containing package.json and pnpm-lock.yaml
    default: web
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
        package-manager-cache: false
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: ${{ inputs.directory }}/package.json
    - name: Install locked dependencies
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: pnpm install --frozen-lockfile
