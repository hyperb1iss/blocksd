version: 2
updates:
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/setup-js]
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directories: [/web, /docs]
    schedule:
      interval: weekly
    groups:
      javascript:
        patterns: ["*"]
